[package]
name = "ros_rust_app_demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal ROS Rust binary depending on ros_rust_lib_demo."

[dependencies]
# Plain crates.io-style version dep on purpose: the bridge (pallet-patcher +
# ROS-prefix-shipped source) must supply A. No path=/git= here.
ros_rust_lib_demo = "0.1.0"

[[bin]]
name = "ros_rust_app_demo"
path = "src/main.rs"
